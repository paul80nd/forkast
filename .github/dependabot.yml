# Keep dependencies current with weekly Dependabot PRs. The CI workflow (build + test) gates
# every PR, so a bad bump is caught before merge. Low-risk minor/patch bumps are grouped into a
# single PR each to keep the noise down; majors still arrive as their own PRs for a proper look.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @types/node tracks the Node major we actually run on (24) — bumped in lockstep with
      # the runtime, not on Dependabot's schedule. Minor/patch within the major still flow.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
