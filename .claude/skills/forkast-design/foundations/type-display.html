<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--fk-font-body);color:var(--fk-text);background:var(--fk-surface-page);-webkit-font-smoothing:antialiased;}
  .wrap{padding:22px 26px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;}
  .swatch{border-radius:var(--fk-radius-md);border:1px solid rgba(0,0,0,.06);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--fk-font-mono);font-size:10px;color:rgba(255,255,255,.92);}
  .swatch.dark-label{color:rgba(0,0,0,.55);}
  .cap{font-size:var(--fk-text-xs);color:var(--fk-text-muted);margin-bottom:10px;}
  .mono{font-family:var(--fk-font-mono);}
  .d{font-family:var(--fk-font-display);letter-spacing:var(--fk-tracking-display);line-height:var(--fk-leading-tight);} .meta{font-family:var(--fk-font-mono);font-size:10px;color:var(--fk-text-subtle);}
</style>
</head>
<body><div class="wrap">
  <div class="d" style="font-size:34px;font-weight:700;">Fresh from your kitchen</div>
  <div class="meta">display / 34 / 700</div>
  <div class="d" style="font-size:26px;font-weight:600;margin-top:14px;">Plan a varied week</div>
  <div class="meta">h1 / 26 / 600</div>
  <div class="d" style="font-size:19px;font-weight:600;margin-top:12px;">Suggested week</div>
  <div class="meta">h2 / 19 / 600</div>
</div></body></html>
