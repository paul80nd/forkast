<!-- @dsCard group="Colors" viewport="700x210" name="Semantic roles" subtitle="Style against these, not raw ramps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--fk-font-body);color:var(--fk-text);background:var(--fk-surface-page);-webkit-font-smoothing:antialiased;}
  .wrap{padding:22px 26px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;}
  .swatch{border-radius:var(--fk-radius-md);border:1px solid rgba(0,0,0,.06);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--fk-font-mono);font-size:10px;color:rgba(255,255,255,.92);}
  .swatch.dark-label{color:rgba(0,0,0,.55);}
  .cap{font-size:var(--fk-text-xs);color:var(--fk-text-muted);margin-bottom:10px;}
  .mono{font-family:var(--fk-font-mono);}
  .sg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;} .tile{border-radius:var(--fk-radius-md);border:1px solid var(--fk-border);padding:10px;font-size:var(--fk-text-2xs);} .dot{width:100%;height:30px;border-radius:6px;margin-bottom:6px;} .name{color:var(--fk-text);font-weight:600;} .var{color:var(--fk-text-muted);font-family:var(--fk-font-mono);}
</style>
</head>
<body><div class="wrap">
  <div class="sg">
    <div class="tile"><div class="dot" style="background:var(--fk-brand)"></div><div class="name">Brand</div><div class="var">--fk-brand</div></div>
    <div class="tile"><div class="dot" style="background:var(--fk-star)"></div><div class="name">Star</div><div class="var">--fk-star</div></div>
    <div class="tile"><div class="dot" style="background:var(--fk-info)"></div><div class="name">Info</div><div class="var">--fk-info</div></div>
    <div class="tile"><div class="dot" style="background:var(--fk-danger)"></div><div class="name">Danger</div><div class="var">--fk-danger</div></div>
    <div class="tile"><div class="dot" style="background:var(--fk-surface-card);border:1px solid var(--fk-border)"></div><div class="name">Card</div><div class="var">--fk-surface-card</div></div>
    <div class="tile"><div class="dot" style="background:var(--fk-surface-sunken)"></div><div class="name">Sunken</div><div class="var">--fk-surface-sunken</div></div>
    <div class="tile"><div class="dot" style="background:var(--fk-border-strong)"></div><div class="name">Border</div><div class="var">--fk-border</div></div>
    <div class="tile"><div class="dot" style="background:var(--fk-text)"></div><div class="name">Text</div><div class="var">--fk-text</div></div>
  </div>
</div></body></html>
