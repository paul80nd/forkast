<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--fk-font-body);color:var(--fk-text);background:var(--fk-surface-page);-webkit-font-smoothing:antialiased;}
  .wrap{padding:22px 26px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;}
  .swatch{border-radius:var(--fk-radius-md);border:1px solid rgba(0,0,0,.06);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--fk-font-mono);font-size:10px;color:rgba(255,255,255,.92);}
  .swatch.dark-label{color:rgba(0,0,0,.55);}
  .cap{font-size:var(--fk-text-xs);color:var(--fk-text-muted);margin-bottom:10px;}
  .mono{font-family:var(--fk-font-mono);}
  .lock{display:flex;align-items:center;gap:14px;} .mk{width:56px;height:56px;border-radius:16px;background:var(--fk-brand);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--fk-font-display);font-weight:700;font-size:34px;} .wm{font-family:var(--fk-font-display);font-weight:700;font-size:34px;letter-spacing:var(--fk-tracking-display);}
</style>
</head>
<body><div class="wrap">
  <div class="lock">
    <div class="mk">F</div>
    <div class="wm">Forkast <span style="font-family:var(--fk-font-body);font-weight:400;font-size:26px;">🍴</span></div>
  </div>
  <p class="cap" style="margin-top:16px;margin-bottom:0;">Placeholder mark only — the letterform F in a rounded square, recoloured to brand green. No full logo exists; render the wordmark in Bricolage Grotesque elsewhere.</p>
</div></body></html>
