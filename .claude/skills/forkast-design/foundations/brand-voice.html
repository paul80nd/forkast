<!-- @dsCard group="Brand" viewport="700x230" name="Voice — household verdicts" subtitle="Star & rotation vocabulary" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--fk-font-body);color:var(--fk-text);background:var(--fk-surface-page);-webkit-font-smoothing:antialiased;}
  .wrap{padding:22px 26px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;}
  .swatch{border-radius:var(--fk-radius-md);border:1px solid rgba(0,0,0,.06);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--fk-font-mono);font-size:10px;color:rgba(255,255,255,.92);}
  .swatch.dark-label{color:rgba(0,0,0,.55);}
  .cap{font-size:var(--fk-text-xs);color:var(--fk-text-muted);margin-bottom:10px;}
  .mono{font-family:var(--fk-font-mono);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;} .lbl{font-size:var(--fk-text-2xs);letter-spacing:var(--fk-tracking-caps);text-transform:uppercase;color:var(--fk-text-muted);margin-bottom:8px;} ul{margin:0;padding:0;list-style:none;font-size:var(--fk-text-sm);line-height:2;} .g{width:1.6em;display:inline-block;} .s{color:var(--fk-star-ink);} .i{color:var(--fk-info-ink);}
</style>
</head>
<body><div class="wrap">
  <div class="grid">
    <div><div class="lbl">★ Quality — how good</div><ul>
      <li><span class="g s">★5</span> Yum Yum</li><li><span class="g s">★4</span> Like it</li><li><span class="g s">★3</span> I'd eat it</li><li><span class="g s">★2</span> Rather not</li><li><span class="g s">★1</span> Yuk</li></ul></div>
    <div><div class="lbl">◆ Rotation — how often</div><ul>
      <li><span class="g i">◆5</span> On repeat</li><li><span class="g i">◆4</span> Often</li><li><span class="g i">◆3</span> Now &amp; then</li><li><span class="g i">◆2</span> Occasionally</li><li><span class="g i">◆1</span> Rarely</li></ul></div>
  </div>
</div></body></html>
