<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--fk-font-body);color:var(--fk-text);background:var(--fk-surface-page);-webkit-font-smoothing:antialiased;}
  .wrap{padding:22px 26px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;}
  .swatch{border-radius:var(--fk-radius-md);border:1px solid rgba(0,0,0,.06);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--fk-font-mono);font-size:10px;color:rgba(255,255,255,.92);}
  .swatch.dark-label{color:rgba(0,0,0,.55);}
  .cap{font-size:var(--fk-text-xs);color:var(--fk-text-muted);margin-bottom:10px;}
  .mono{font-family:var(--fk-font-mono);}
  .bar{display:flex;align-items:flex-end;gap:14px;} .u{text-align:center;} .b{background:var(--fk-brand-tint);border:1px solid var(--fk-green-300);border-radius:4px;} .t{font-family:var(--fk-font-mono);font-size:10px;color:var(--fk-text-muted);margin-top:6px;}
</style>
</head>
<body><div class="wrap">
  <div class="bar">
    <div class="u"><div class="b" style="width:4px;height:4px;"></div><div class="t">1·4</div></div><div class="u"><div class="b" style="width:8px;height:8px;"></div><div class="t">2·8</div></div><div class="u"><div class="b" style="width:12px;height:12px;"></div><div class="t">3·12</div></div><div class="u"><div class="b" style="width:16px;height:16px;"></div><div class="t">4·16</div></div><div class="u"><div class="b" style="width:20px;height:20px;"></div><div class="t">5·20</div></div><div class="u"><div class="b" style="width:24px;height:24px;"></div><div class="t">6·24</div></div><div class="u"><div class="b" style="width:32px;height:32px;"></div><div class="t">8·32</div></div><div class="u"><div class="b" style="width:40px;height:40px;"></div><div class="t">10·40</div></div><div class="u"><div class="b" style="width:48px;height:48px;"></div><div class="t">12·48</div></div>
  </div>
</div></body></html>
