<!-- @dsCard group="Colors" viewport="700x120" name="Honey — quality stars" subtitle="★ ratings & gentle warnings" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--fk-font-body);color:var(--fk-text);background:var(--fk-surface-page);-webkit-font-smoothing:antialiased;}
  .wrap{padding:22px 26px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;}
  .swatch{border-radius:var(--fk-radius-md);border:1px solid rgba(0,0,0,.06);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--fk-font-mono);font-size:10px;color:rgba(255,255,255,.92);}
  .swatch.dark-label{color:rgba(0,0,0,.55);}
  .cap{font-size:var(--fk-text-xs);color:var(--fk-text-muted);margin-bottom:10px;}
  .mono{font-family:var(--fk-font-mono);}
  
</style>
</head>
<body><div class="wrap"><p class="cap">Warm honey for ★ stars and soft attention (cooked-recently, "check these").</p>
<div class="row"><div class="swatch dark-label" style="flex:1;min-width:52px;background:var(--fk-honey-50)">50</div><div class="swatch dark-label" style="flex:1;min-width:52px;background:var(--fk-honey-100)">100</div><div class="swatch dark-label" style="flex:1;min-width:52px;background:var(--fk-honey-200)">200</div><div class="swatch" style="flex:1;min-width:52px;background:var(--fk-honey-400)">400</div><div class="swatch" style="flex:1;min-width:52px;background:var(--fk-honey-500)">500</div><div class="swatch" style="flex:1;min-width:52px;background:var(--fk-honey-600)">600</div><div class="swatch" style="flex:1;min-width:52px;background:var(--fk-honey-700)">700</div></div></div></body></html>
