<!-- @dsCard group="Type" viewport="700x180" name="Mono & eyebrow" subtitle="Ingredient breakdown · caps labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--fk-font-body);color:var(--fk-text);background:var(--fk-surface-page);-webkit-font-smoothing:antialiased;}
  .wrap{padding:22px 26px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;}
  .swatch{border-radius:var(--fk-radius-md);border:1px solid rgba(0,0,0,.06);height:56px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--fk-font-mono);font-size:10px;color:rgba(255,255,255,.92);}
  .swatch.dark-label{color:rgba(0,0,0,.55);}
  .cap{font-size:var(--fk-text-xs);color:var(--fk-text-muted);margin-bottom:10px;}
  .mono{font-family:var(--fk-font-mono);}
  .eye{font-size:var(--fk-text-2xs);letter-spacing:var(--fk-tracking-caps);text-transform:uppercase;color:var(--fk-text-muted);font-weight:600;} .line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--fk-divider);font-size:14px;} .mono{font-family:var(--fk-font-mono);font-size:12px;color:var(--fk-text-muted);}
</style>
</head>
<body><div class="wrap">
  <div class="eye">Ingredients</div>
  <div style="margin-top:8px;">
    <div class="line"><span>300g orzo</span><span class="mono">300 g · orzo</span></div>
    <div class="line"><span>400g cherry tomatoes</span><span class="mono">400 g · cherry tomatoes</span></div>
    <div class="line" style="border-bottom:none;"><span>2 garlic cloves</span><span class="mono">2 · garlic</span></div>
  </div>
</div></body></html>
