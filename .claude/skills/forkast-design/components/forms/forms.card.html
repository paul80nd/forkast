<!-- @dsCard group="Components" viewport="700x180" name="Form controls" subtitle="Input, search, select, checkbox" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
*{box-sizing:border-box;} body{margin:0;font-family:var(--fk-font-body);color:var(--fk-text);background:var(--fk-surface-page);-webkit-font-smoothing:antialiased;}
.wrap{padding:22px 24px;}
.eye{font-size:var(--fk-text-2xs);letter-spacing:var(--fk-tracking-caps);text-transform:uppercase;color:var(--fk-text-subtle);font-weight:600;margin:0 0 10px;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.stack{display:flex;flex-direction:column;gap:16px;}
/* button */
.btn{font-family:var(--fk-font-body);font-weight:var(--fk-weight-medium);font-size:var(--fk-text-body);padding:7px 15px;border-radius:var(--fk-radius-md);border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.1;}
.b-primary{background:var(--fk-brand);color:#fff;} .b-positive{background:var(--fk-positive-tint);color:var(--fk-positive-ink);}
.b-soft{background:var(--fk-brand-tint);color:var(--fk-brand-ink);} .b-danger{background:var(--fk-danger);color:#fff;}
.b-ghost{background:transparent;color:var(--fk-text-muted);} .b-outline{background:var(--fk-surface-card);color:var(--fk-text);border-color:var(--fk-border-strong);}
.btn.sm{font-size:var(--fk-text-sm);padding:5px 11px;} .btn.dis{opacity:.5;cursor:not-allowed;}
.ib{width:34px;height:34px;border-radius:var(--fk-radius-md);border:none;background:transparent;color:var(--fk-text-muted);font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.seg{display:inline-flex;border:1px solid var(--fk-border-strong);border-radius:var(--fk-radius-md);overflow:hidden;}
.seg button{font-family:var(--fk-font-body);font-weight:500;font-size:var(--fk-text-sm);padding:5px 14px;border:none;background:var(--fk-surface-card);color:var(--fk-text-muted);cursor:pointer;}
.seg button+button{border-left:1px solid var(--fk-border);} .seg .on{background:var(--fk-brand);color:#fff;}
.inp{font-family:var(--fk-font-body);font-size:var(--fk-text-sm);color:var(--fk-text);background:var(--fk-surface-card);padding:7px 11px;border-radius:var(--fk-radius-md);border:1px solid var(--fk-border-strong);outline:none;min-width:220px;}
.inp.foc{border-color:var(--fk-brand);box-shadow:var(--fk-shadow-focus);}
.sel{position:relative;display:inline-block;} .sel select{appearance:none;font-family:var(--fk-font-body);font-size:var(--fk-text-sm);color:var(--fk-text);background:var(--fk-surface-card);padding:7px 30px 7px 11px;border-radius:var(--fk-radius-md);border:1px solid var(--fk-border-strong);cursor:pointer;} .sel .car{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--fk-text-muted);font-size:11px;pointer-events:none;}
.cbx{display:inline-flex;align-items:center;gap:8px;font-size:var(--fk-text-sm);color:var(--fk-text-muted);} .cbx input{width:16px;height:16px;accent-color:var(--fk-brand);}
</style></head><body><div class="wrap">
<div class="stack">
  <div><p class="eye">Text & search · default and focused</p><div class="row">
    <input class="inp" placeholder="Add anything else…">
    <input class="inp foc" value="tomato" placeholder="Search…">
  </div></div>
  <div><p class="eye">Select · checkbox</p><div class="row">
    <span class="sel"><select><option>All cuisines</option><option>Italian</option></select><span class="car">▾</span></span>
    <span class="sel"><select><option>Top rated (your ★)</option></select><span class="car">▾</span></span>
    <label class="cbx"><input type="checkbox" checked> Group variants</label>
    <label class="cbx"><input type="checkbox"> Include unrated</label>
  </div></div>
</div></div></body></html>
