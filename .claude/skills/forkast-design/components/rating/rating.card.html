<!-- @dsCard group="Components" viewport="700x180" name="Rating scales" subtitle="★ quality (honey) · ◆ rotation (harbour)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
*{box-sizing:border-box;} body{margin:0;font-family:var(--fk-font-body);color:var(--fk-text);background:var(--fk-surface-page);-webkit-font-smoothing:antialiased;}
.wrap{padding:22px 24px;}
.eye{font-size:var(--fk-text-2xs);letter-spacing:var(--fk-tracking-caps);text-transform:uppercase;color:var(--fk-text-subtle);font-weight:600;margin:0 0 10px;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.stack{display:flex;flex-direction:column;gap:16px;}
/* button */
.btn{font-family:var(--fk-font-body);font-weight:var(--fk-weight-medium);font-size:var(--fk-text-body);padding:7px 15px;border-radius:var(--fk-radius-md);border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.1;}
.b-primary{background:var(--fk-brand);color:#fff;} .b-positive{background:var(--fk-positive-tint);color:var(--fk-positive-ink);}
.b-soft{background:var(--fk-brand-tint);color:var(--fk-brand-ink);} .b-danger{background:var(--fk-danger);color:#fff;}
.b-ghost{background:transparent;color:var(--fk-text-muted);} .b-outline{background:var(--fk-surface-card);color:var(--fk-text);border-color:var(--fk-border-strong);}
.btn.sm{font-size:var(--fk-text-sm);padding:5px 11px;} .btn.dis{opacity:.5;cursor:not-allowed;}
.ib{width:34px;height:34px;border-radius:var(--fk-radius-md);border:none;background:transparent;color:var(--fk-text-muted);font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.seg{display:inline-flex;border:1px solid var(--fk-border-strong);border-radius:var(--fk-radius-md);overflow:hidden;}
.seg button{font-family:var(--fk-font-body);font-weight:500;font-size:var(--fk-text-sm);padding:5px 14px;border:none;background:var(--fk-surface-card);color:var(--fk-text-muted);cursor:pointer;}
.seg button+button{border-left:1px solid var(--fk-border);} .seg .on{background:var(--fk-brand);color:#fff;}
.sc{display:inline-flex;gap:2px;} .g{line-height:1;} .lg{font-size:30px;} .md{font-size:20px;} .sm{font-size:16px;}
.star{color:var(--fk-star);} .rot{color:var(--fk-info);} .empty{color:var(--fk-neutral-300);}
.lab{font-size:var(--fk-text-sm);color:var(--fk-text-muted);margin-left:8px;}
</style></head><body><div class="wrap">
<div class="stack">
  <div><p class="eye">Quality — ★ with verdict (lg)</p><div class="row">
    <span class="sc lg"><span class="g star">★</span><span class="g star">★</span><span class="g star">★</span><span class="g star">★</span><span class="g empty">★</span></span>
    <span class="lab">Like it</span>
  </div></div>
  <div><p class="eye">Rotation — ◆ (md) · read-only row (sm)</p><div class="row">
    <span class="sc md"><span class="g rot">◆</span><span class="g rot">◆</span><span class="g rot">◆</span><span class="g empty">◆</span><span class="g empty">◆</span></span>
    <span class="lab">Now &amp; then</span>
    <span style="width:24px;"></span>
    <span class="sc sm"><span class="g star">★</span><span class="g star">★</span><span class="g star">★</span><span class="g star">★</span><span class="g star">★</span></span>
    <span class="lab">Yum Yum</span>
  </div></div>
</div></div></body></html>
